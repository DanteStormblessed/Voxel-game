[package]
name = "tokikura"
version.workspace = true
edition.workspace = true
description = "Tokikura, a voxel sandbox game built on the KuraVoxel engine"
default-run = "tokikura"

[dependencies]
kuravoxel-common.workspace = true
kuravoxel-server.workspace = true
kuravoxel-client.workspace = true
kuravoxel-ui.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true

[[bin]]
name = "tokikura"
path = "src/main.rs"

[[bin]]
name = "tokikura-server"
path = "src/bin/server.rs"
