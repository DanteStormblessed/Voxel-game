[workspace]
resolver = "2"
members = [
    "crates/kuravoxel-common",
    "crates/kuravoxel-server",
    "crates/kuravoxel-client",
    "crates/kuravoxel-ui",
    "crates/tokikura",
]
default-members = ["crates/tokikura"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
kuravoxel-common = { path = "crates/kuravoxel-common" }
kuravoxel-server = { path = "crates/kuravoxel-server" }
kuravoxel-client = { path = "crates/kuravoxel-client" }
kuravoxel-ui = { path = "crates/kuravoxel-ui" }
# wgpu y winit van a la par de los que usa Iced (iced_wgpu / iced_winit 0.14): el motor y
# la interfaz comparten dispositivo gráfico y eventos de ventana.
wgpu = "27"
winit = "0.30"
iced_wgpu = "0.14"
iced_winit = "0.14"
iced_widget = { version = "0.14", features = ["wgpu", "image", "canvas"] }
iced_runtime = "0.14"
glam = "0.30"
rayon = "1"
rustc-hash = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "signal"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
bytes = "1"
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.22"

# Debug usable: nuestro código con optimización ligera, dependencias a tope.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
